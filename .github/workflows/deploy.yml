name: SCF Cohort DAB Deploy

# ── Branch → Environment mapping ────────────────────────────────────────────
#
#  feature/* → PR      → validate + plan   (dev, no deploy)
#  develop   → push    → deploy dev         (auto, no approval)
#  release/* → push    → deploy preprod     (required-reviewers in GitHub Env)
#  main      → push    → deploy prod        (manual approval gate in GitHub Env)
#
on:
  push:
    branches:
      - develop
      - release/**
      - main
  pull_request:
    branches:
      - develop
      - main

# ── GitHub OIDC → Databricks (no Azure AD, no PAT, no client_secret) ────────
# The Databricks CLI exchanges the GitHub JWT directly with Databricks when
# DATABRICKS_HOST + DATABRICKS_CLIENT_ID are set and id-token:write is granted.
# Nothing sensitive lives in this repo or in GitHub secrets.
permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  # ── 0. UNIT TESTS (every PR + every push, no Databricks needed) ───────────
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest tests/
        # Exclude Spark/Databricks-runtime-dependent suites; both self-skip, but
        # we exclude them explicitly so databricks-connect (installed via
        # requirements-dev.txt) cannot attempt to start a local Spark session.
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml --ignore=tests/integration_test.py --ignore=tests/test_quality_checks.py
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results.xml

  # ── 1. VALIDATE (every PR + every push) ───────────────────────────────────
  validate:
    name: Bundle Validate
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_DEV }}
        run: databricks bundle validate -t dev

  # ── 2. PLAN on PR — shows what would change, no deploy ────────────────────
  plan:
    name: Bundle Plan (PR)
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle validate -t dev (plan)
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_DEV }}
        run: databricks bundle validate -t dev

  # ── 3. DEPLOY DEV — on push to develop ────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev
    needs: validate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev          # no approval required
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle deploy -t dev
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_DEV }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_DEV }}
        run: databricks bundle deploy -t dev

  # ── 4. DEPLOY PREPROD — on push to release/* ──────────────────────────────
  deploy-preprod:
    name: Deploy → Preprod
    needs: validate
    if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: preprod      # required-reviewers gate configured here in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle deploy -t preprod
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_PREPROD }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_PREPROD }}
        run: databricks bundle deploy -t preprod

  # ── 5. INTEGRATION TESTS (CI) — in staging/preprod workspace ──────────────
  # Runs all 5 test stages (training, validation, deployment, inference,
  # monitoring) in preprod before prod is ever touched.
  # Maps to the "Integration tests (CI)" box in the staging workspace diagram.
  integration-tests:
    name: Integration Tests (CI) — Staging
    needs: deploy-preprod
    if: startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Run integration test job in preprod
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_PREPROD }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_PREPROD }}
        run: |
          databricks bundle run scf_integration_tests -t preprod --no-wait=false
      - name: databricks bundle validate -t preprod (post-test check)
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_PREPROD }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_PREPROD }}
        run: databricks bundle validate -t preprod

  # ── 6. DEPLOY PROD — only after integration tests pass ────────────────────
  deploy-prod:
    name: Deploy → Prod
    needs: [validate, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod         # manual approval + FMC sign-off gate in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: databricks bundle deploy -t prod
        env:
          DATABRICKS_HOST:      ${{ vars.DATABRICKS_HOST_PROD }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID_PROD }}
        run: databricks bundle deploy -t prod
