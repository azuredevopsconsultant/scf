name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        # Off-cluster unit tests only. The two Databricks/Spark-dependent
        # modules are excluded from CI and run elsewhere:
        #   - integration_test.py    -> on a real cluster, post-deploy, via the
        #                               integration_test_job (needs dbutils/spark)
        #   - test_quality_checks.py -> locally / on-cluster with a real Spark
        #                               session (needs pyspark)
        # Both already self-skip, but we exclude them explicitly so a transitive
        # pyspark (pulled in by databricks-connect) can't try to start or connect
        # a Spark session on the CI runner. Do NOT generate a conftest.py that
        # mocks dbutils/spark/pyspark - that defeats the skip guards and forces
        # the integration notebook to run against MagicMocks.
        run: pytest tests/ -q -ra --ignore=tests/integration_test.py --ignore=tests/test_quality_checks.py

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev
