# =============================================================================
# MAINTENANCE JOB
# Weekly Delta OPTIMIZE + ZORDER + ANALYZE on all key tables.
# Runs Sunday 02:00 UTC — before the weekly batch window.
# =============================================================================
resources:
  jobs:
    scf_maintenance_pipeline:
      name: "[${bundle.target}] SCF Cohort - Delta Maintenance"

      tags:
        project: scf_cohort_matrix
        pipeline_type: maintenance
        environment: ${var.environment}

      email_notifications:
        on_failure:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true

      # Every Sunday at 02:00 UTC
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "UTC"
        pause_status: ${var.pipeline_pause_status}

      max_concurrent_runs: 1
      queue:
        enabled: true

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            # Runtime deps installed on the serverless job compute. Single
            # source of truth lives in requirements.txt (synced to the
            # workspace files root), so dev/preprod/prod all run identical
            # pinned versions.
            dependencies:
              - "-r ${workspace.file_path}/requirements.txt"

      tasks:
        - task_key: delta_optimize
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/dev/delta_maintenance.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema:  "{{job.parameters.schema}}"
          timeout_seconds: 7200
