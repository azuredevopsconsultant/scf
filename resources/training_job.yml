# =============================================================================
# TRAINING PIPELINE
# Data Ingestion -> Preprocessing -> Model Training -> Model Evaluation ->
# MLflow Registration (Champion/Challenger)
#
# Notification strategy (best practice, see README §Notifications):
#   - Job-level email_notifications fire exactly once per run, regardless of
#     which task failed. This is the reliable "pipeline succeeded / pipeline
#     failed" signal and is cheaper/simpler than wiring a mail task at the end.
#   - on_duration_warning_threshold_exceeded catches silent hangs (e.g. GLM
#     fit looping) that aren't outright failures but eat cluster hours.
# =============================================================================
resources:
  jobs:
    scf_training_pipeline:
      name: "[${bundle.target}] SCF Cohort - Training Pipeline"

      tags:
        project: scf_cohort_matrix
        pipeline_type: training
        environment: ${var.environment}

      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true

      notification_settings:
        no_alert_for_canceled_runs: false

      # Quarterly retrain: 1st of Jan, Apr, Jul, Oct at 03:00 UTC.
      schedule:
        quartz_cron_expression: "0 0 3 1 1,4,7,10 ?"
        timezone_id: "UTC"
        pause_status: ${var.pipeline_pause_status}

      max_concurrent_runs: 1
      queue:
        enabled: true

      performance_target: STANDARD

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: model_name
          default: ${var.model_name}
        - name: model_schema
          default: ${var.model_schema}
        - name: training_start_period
          default: ${var.training_start_period}
        - name: cutoff_period
          default: ${var.cutoff_period}
        - name: test_end_period
          default: ${var.test_end_period}
        - name: environment
          default: ${var.environment}
        - name: fmc_approval_required
          default: ${var.fmc_approval_required}
        - name: notification_webhook_url
          default: ${var.notification_webhook_url}
        - name: serving_endpoint_name
          default: ${var.serving_endpoint_name}
        - name: volume_path
          # UC Volume holding the real source files:
          #   base_query_df_apr_2026.parquet, moneyfacts_merge.parquet,
          #   QRM_products_revised.csv
          default: ${var.volume_path}
        - name: feature_schema
          default: feature_store

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            # Runtime deps installed on the serverless job compute. Single
            # source of truth lives in requirements.txt (synced to the
            # workspace files root), so dev/preprod/prod all run identical
            # pinned versions.
            dependencies:
              - "-r ${workspace.file_path}/requirements.txt"

      tasks:
        # First task: land the raw source files from the UC Volume.
        - task_key: data_ingestion
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/01_data_ingestion.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              volume_path: "{{job.parameters.volume_path}}"
          timeout_seconds: 3600

        - task_key: data_preprocessing
          depends_on:
            - task_key: data_ingestion
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/02_data_preprocessing.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
          timeout_seconds: 3600

        # Feature engineering: validate GLM flow-ratio ranges and build the
        # 3 lookup tables (receipts/outflows by cohort age × rate bucket;
        # transfers by rate bucket only) from the cohort matrix.
        - task_key: feature_engineering
          depends_on:
            - task_key: data_preprocessing
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/00_feature_engineering.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              feature_schema: "{{job.parameters.feature_schema}}"
          timeout_seconds: 1800

        - task_key: data_validation
          depends_on:
            - task_key: feature_engineering
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/02b_data_validation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
          timeout_seconds: 1800

        - task_key: model_training
          depends_on:
            - task_key: data_validation
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 600000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/03_model_training.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_schema: "{{job.parameters.model_schema}}"
              training_start_period: "{{job.parameters.training_start_period}}"
              cutoff_period: "{{job.parameters.cutoff_period}}"
              test_end_period: "{{job.parameters.test_end_period}}"
          timeout_seconds: 10800

        - task_key: model_evaluation
          depends_on:
            - task_key: model_training
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/04_model_evaluation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_schema: "{{job.parameters.model_schema}}"
          timeout_seconds: 3600

        # Model Validation Job — checks description, MAPE gate, business
        # metrics (projected balance Challenger vs Champion), product coverage.
        # Sets validation_passed task value consumed by check_validation_gate.
        - task_key: model_validation
          depends_on:
            - task_key: model_evaluation
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/04b_model_validation.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_schema: "{{job.parameters.model_schema}}"
              model_name: "{{job.parameters.model_name}}"
          timeout_seconds: 3600

        # Condition gate: only proceed to model_registration if validation passed.
        # Rejected challengers are tagged by 05_model_registration when
        # validation_passed=false flows through.
        - task_key: check_validation_gate
          depends_on:
            - task_key: model_validation
          condition_task:
            op: "EQUAL_TO"
            left: "{{tasks.model_validation.values.validation_passed}}"
            right: "true"

        # FMC Second-Line Validation Gate — human-in-the-loop.
        # Writes PENDING to model_approvals, notifies FMC via Teams/email,
        # then polls for APPROVED/REJECTED for up to fmc_timeout_minutes.
        # FMC reviewer runs fmc_approve.py separately to record their decision.
        # Task timeout set to 25h to allow a full business day for sign-off.
        - task_key: fmc_validation_gate
          depends_on:
            - task_key: check_validation_gate
              outcome: "true"
          environment_key: default
          max_retries: 0
          notebook_task:
            notebook_path: ../src/training/05a_fmc_validation_gate.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_name: "{{job.parameters.model_name}}"
              environment: "{{job.parameters.environment}}"
              fmc_approval_required: "{{job.parameters.fmc_approval_required}}"
              fmc_timeout_minutes: "1440"
              notification_email: ${var.notification_email}
              notification_webhook_url: "{{job.parameters.notification_webhook_url}}"
          timeout_seconds: 90000    # 25h — covers full business day sign-off window
          email_notifications:
            on_failure:
              - ${var.notification_email}

        - task_key: model_registration
          depends_on:
            - task_key: fmc_validation_gate
          run_if: ALL_SUCCESS
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/05_model_registration.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_schema: "{{job.parameters.model_schema}}"
              model_name: "{{job.parameters.model_name}}"
          timeout_seconds: 1800
          # Task-level alert in addition to the job-level one: this is the
          # single most business-critical step (it decides Champion vs
          # Challenger), so it gets its own explicit notification too.
          email_notifications:
            on_success:
              - ${var.notification_email}
            on_failure:
              - ${var.notification_email}

        - task_key: deploy_serving_endpoint
          depends_on:
            - task_key: model_registration
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/07_deploy_serving_endpoint.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_name: "{{job.parameters.model_name}}"
              serving_endpoint_name: "{{job.parameters.serving_endpoint_name}}"
          timeout_seconds: 1800

        - task_key: smoke_test_serving_endpoint
          depends_on:
            - task_key: deploy_serving_endpoint
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/08_smoke_test_serving_endpoint.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              serving_endpoint_name: "{{job.parameters.serving_endpoint_name}}"
          timeout_seconds: 900

        # Auto rollback guard: reverts endpoint to prior champion if smoke
        # test failed, and writes rollback_events audit table regardless.
        - task_key: auto_rollback_guard
          depends_on:
            - task_key: smoke_test_serving_endpoint
          run_if: ALL_DONE
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/09_auto_rollback_guard.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              model_name: "{{job.parameters.model_name}}"
              serving_endpoint_name: "{{job.parameters.serving_endpoint_name}}"
          timeout_seconds: 900

        - task_key: confirmation_mail
          depends_on:
            - task_key: auto_rollback_guard
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: true
          notebook_task:
            notebook_path: ../src/training/06_confirmation_mail.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              notification_email: ${var.notification_email}
              notification_webhook_url: "{{job.parameters.notification_webhook_url}}"
          timeout_seconds: 900
          # Always runs, even if an upstream task failed, so the recipient
          # gets a run summary either way (same pattern as the inference job).
          run_if: ALL_DONE
